server:
  host: 0.0.0.0
  port: 3000

database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  name: app
  schemas:
    - public
  sslmode: disable
  pool:
    max_open: 25
    max_idle: 5
    conn_max_life: 1h
    conn_max_idle: 10m

permissions:
  "*":
    methods: all
  # users:
  #   methods: [GET, HEAD]
  # projects:
  #   methods: [GET, HEAD, POST, PATCH, DELETE]
  # "*":
  #   methods: [GET]

rpc:
  "*":
    enabled: true

transactions:
  enabled: true
  ttl: 30m
  cleanup_interval: 60s

hot_reload:
  enabled: false
  interval: 30s

rate_limit:
  enabled: false
  requests_per_second: 10
  burst: 20
  # per_table:
  #   users:
  #     requests_per_second: 5
  #     burst: 10

# Tables cachées de l'OpenAPI et /info (supporte les wildcards : rest_*)
hidden_tables:
  - rest_*
  - internal_*
