<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rest-trans</title>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --border: #2a2d3a;
            --text: #e1e4ed;
            --text-dim: #8b8fa3;
            --accent: #6c8cff;
            --green: #4ade80;
            --red: #f87171;
            --yellow: #fbbf24;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }
        .container { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem; }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        h1 { font-size: 1.4rem; font-weight: 600; }
        h1 span { color: var(--accent); }

        .links { display: flex; gap: 1rem; }
        .links a {
            color: var(--accent);
            text-decoration: none;
            padding: 0.4rem 0.8rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.85rem;
            transition: all 0.15s;
        }
        .links a:hover { border-color: var(--accent); background: rgba(108,140,255,0.1); }

        .section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }
        .section-header {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .section-body { padding: 1rem; }

        .health {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.9rem;
        }
        .dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot.ok { background: var(--green); box-shadow: 0 0 8px rgba(74,222,128,0.5); }
        .dot.down { background: var(--red); box-shadow: 0 0 8px rgba(248,113,113,0.5); }
        .dot.loading { background: var(--yellow); box-shadow: 0 0 8px rgba(251,191,36,0.5); }

        .sse-controls {
            display: flex;
            gap: 0.6rem;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 0.8rem;
        }
        .sse-controls select, .sse-controls button {
            font-family: inherit;
            font-size: 0.8rem;
            padding: 0.4rem 0.7rem;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 4px;
            outline: none;
        }
        .sse-controls select:focus, .sse-controls button:focus {
            border-color: var(--accent);
        }
        .sse-controls button {
            cursor: pointer;
            transition: all 0.15s;
        }
        .sse-controls button:hover { border-color: var(--accent); }
        .sse-controls button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        .sse-log {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.8rem;
            height: 350px;
            overflow-y: auto;
            font-size: 0.78rem;
            line-height: 1.5;
        }
        .sse-log::-webkit-scrollbar { width: 6px; }
        .sse-log::-webkit-scrollbar-track { background: var(--bg); }
        .sse-log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .sse-entry { margin-bottom: 0.4rem; }
        .sse-entry .ts { color: var(--text-dim); }
        .sse-entry .event { color: var(--accent); font-weight: 600; }
        .sse-entry .data { color: var(--green); }
        .sse-entry .err { color: var(--red); }
        .sse-entry .sys { color: var(--yellow); font-style: italic; }

        .sse-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .sse-toolbar label {
            font-size: 0.78rem;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><span>rest</span>-trans</h1>
            <div class="links">
                <a href="/docs">/docs</a>
                <a href="/openapi.json">/openapi.json</a>
                <a href="/info">/info</a>
                <a href="/ops/metrics">/ops/metrics</a>
            </div>
        </header>

        <div class="section">
            <div class="section-header">
                <span>Santé</span>
                <span id="health-ts" style="font-size:0.75rem"></span>
            </div>
            <div class="section-body">
                <div class="health">
                    <span class="dot loading" id="health-dot"></span>
                    <span id="health-text">Vérification...</span>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-header">
                <span>Console SSE</span>
            </div>
            <div class="section-body">
                <div class="sse-controls">
                    <select id="stream-schema"></select>
                    <select id="stream-table"></select>
                    <button id="btn-connect">Connecter</button>
                    <button id="btn-disconnect" disabled>Déconnecter</button>
                </div>
                <div class="sse-toolbar">
                    <button id="btn-clear" style="font-family:inherit;font-size:0.75rem;padding:0.25rem 0.5rem;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:4px;cursor:pointer;">Vider</button>
                    <label>
                        <input type="checkbox" id="auto-scroll" checked> Auto-scroll
                    </label>
                </div>
                <div class="sse-log" id="sse-log"></div>
            </div>
        </div>
    </div>

    <script>
    (function() {
        const $ = s => document.querySelector(s);
        const $$ = s => document.querySelectorAll(s);

        function ts() {
            return new Date().toLocaleTimeString('fr-FR');
        }

        // Health check
        async function checkHealth() {
            const dot = $('#health-dot');
            const text = $('#health-text');
            const tsEl = $('#health-ts');
            try {
                const r = await fetch('/ops/readiness');
                const j = await r.json();
                if (j.status === 'ok') {
                    dot.className = 'dot ok';
                    text.textContent = 'Opérationnel';
                } else {
                    dot.className = 'dot down';
                    text.textContent = 'Indisponible — ' + (j.error || '');
                }
            } catch(e) {
                dot.className = 'dot down';
                text.textContent = 'Erreur de connexion';
            }
            tsEl.textContent = ts();
        }
        checkHealth();
        setInterval(checkHealth, 5000);

        // Streams
        let schemasData = {};
        let evtSource = null;

        async function loadStreams() {
            try {
                const r = await fetch('/ops/streams');
                schemasData = await r.json();
                const schemaSelect = $('#stream-schema');
                schemaSelect.innerHTML = '';
                for (const schema of Object.keys(schemasData).sort()) {
                    const opt = document.createElement('option');
                    opt.value = schema;
                    opt.textContent = schema;
                    schemaSelect.appendChild(opt);
                }
                updateTables();
            } catch(e) {
                schemasData = {};
            }
        }

        function updateTables() {
            const schema = $('#stream-schema').value;
            const tableSelect = $('#stream-table');
            tableSelect.innerHTML = '';
            const tables = schemasData[schema] || [];
            for (const t of tables.sort()) {
                const opt = document.createElement('option');
                opt.value = t;
                opt.textContent = t;
                tableSelect.appendChild(opt);
            }
        }

        $('#stream-schema').addEventListener('change', updateTables);

        function logEntry(cls, content) {
            const log = $('#sse-log');
            const div = document.createElement('div');
            div.className = 'sse-entry';
            div.innerHTML = '<span class="ts">[' + ts() + ']</span> <span class="' + cls + '">' + content + '</span>';
            log.appendChild(div);
            if ($('#auto-scroll').checked) {
                log.scrollTop = log.scrollHeight;
            }
        }

        $('#btn-connect').addEventListener('click', function() {
            if (evtSource) { evtSource.close(); }
            const schema = $('#stream-schema').value;
            const table = $('#stream-table').value;
            if (!schema || !table) return;

            const url = '/' + encodeURIComponent(schema) + '/' + encodeURIComponent(table) + '/_stream';
            logEntry('sys', 'Connexion à ' + url + '...');
            evtSource = new EventSource(url);

            evtSource.addEventListener('open', function() {
                logEntry('sys', 'Connecté');
                $('#btn-connect').classList.add('active');
                $('#btn-disconnect').disabled = false;
            });

            evtSource.addEventListener(table, function(e) {
                logEntry('event', '<b>' + table + '</b>');
                logEntry('data', escapeHtml(e.data));
            });

            evtSource.addEventListener('connected', function(e) {
                logEntry('sys', 'Stream prêt: ' + e.data);
            });

            evtSource.onerror = function() {
                logEntry('err', 'Erreur de connexion');
                evtSource.close();
                evtSource = null;
                $('#btn-connect').classList.remove('active');
                $('#btn-disconnect').disabled = true;
            };
        });

        $('#btn-disconnect').addEventListener('click', function() {
            if (evtSource) {
                logEntry('sys', 'Déconnecté');
                evtSource.close();
                evtSource = null;
            }
            $('#btn-connect').classList.remove('active');
            $('#btn-disconnect').disabled = true;
        });

        $('#btn-clear').addEventListener('click', function() {
            $('#sse-log').innerHTML = '';
        });

        function escapeHtml(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        loadStreams();
    })();
    </script>
</body>
</html>
